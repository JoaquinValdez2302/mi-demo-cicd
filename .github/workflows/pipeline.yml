name: Demostracion CI/CD en Vivo

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  # ==========================================
  # ETAPA 1: INTEGRACIÓN CONTINUA (CI)
  # ==========================================
  ci-pipeline:
    name: 1. Integración Continua (Build & Test)
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 Clonar repositorio
      uses: actions/checkout@v4

    - name: ⚙️ Configurar Node.js v24
      uses: actions/setup-node@v4
      with:
        node-version: '24.x'

    - name: 📦 Instalar pnpm
      uses: pnpm/action-setup@v4
      with:
        version: latest

    - name: 📦 Instalar dependencias
      run: pnpm install --frozen-lockfile

    - name: 🔍 Ejecutar Linter (Validación de Sintaxis)
      run: pnpm lint
      
    - name: 🧪 Ejecutar pruebas automáticas
      run: pnpm test

  # ==========================================
  # ETAPA 2: ENTREGA CONTINUA (CD)
  # ==========================================
  cd-pipeline:
    name: 2. Entrega Continua (Despliegue)
    needs: ci-pipeline # <---  Solo corre si CI pasa
    runs-on: ubuntu-latest
    environment: production
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
    - name: 🚀 Simular Despliegue a Producción
      run: |
        echo "=================================================="
        echo " ¡CI EXITOSO! Las pruebas pasaron correctamente."
        echo " Iniciando fase de Entrega Continua (CD)..."
        echo " Empaquetando y enviando artefacto al entorno..."
        echo " ¡Despliegue completado con éxito en producción!"
        echo "=================================================="