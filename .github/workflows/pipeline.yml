name: CI/CD Pipeline Demo

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
    - name: 📥 Clonar repositorio
      uses: actions/checkout@v4

    - name: ⚙️ Configurar Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}

    - name: 📦 Instalar pnpm
      uses: pnpm/action-setup@v4
      with:
        version: latest

    - name: 📦 Instalar dependencias con pnpm
      run: pnpm install --frozen-lockfile

    - name: 🧪 Ejecutar pruebas unitarias
      run: pnpm test

  deploy:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
    - name: 🚀 Simular Despliegue a Producción
      run: |
        echo "¡Las pruebas pasaron exitosamente!"
        echo "Desplegando la aplicación en el servidor de destino..."
        echo "Despliegue completado con éxito."